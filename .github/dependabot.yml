version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # MkDocs Material of the setup-mkdocs action (requirements.in, hashed requirements.txt)
  - package-ecosystem: "pip"
    directory: "/.github/actions/setup-mkdocs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
