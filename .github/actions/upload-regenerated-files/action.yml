name: Upload regenerated files
description: >
  Hands regenerated files over to a job that holds a write token, so that the job that runs the build needs no secret.
  Only the files that git does not ignore are handed over: a directory can hold build outputs that are never committed.
  The artifact loses the permissions, so the executable files are listed in it. Fails when a path is missing. Runs on
  Linux, in a git working tree

inputs:
  paths:
    description: Space-separated paths of the files or directories to hand over
    required: true
  name:
    description: Artifact name
    required: false
    default: regenerated-files

runs:
  using: composite
  steps:
    - name: Collect the regenerated files
      shell: bash
      env:
        COMMIT_PATHS: ${{ inputs.paths }}
      run: |
        read -ra PATHS <<< "$COMMIT_PATHS"
        STAGE="$RUNNER_TEMP/regenerated-files"
        rm -rf "$STAGE"
        mkdir -p "$STAGE"
        for P in "${PATHS[@]}"; do
          if [[ ! -e "$P" ]]; then
            echo "::error::Missing path: $P"
            exit 1
          fi
        done

        # commit-via-api only commits what git status reports: the ignored files are left out here too,
        # so that a directory with build outputs does not turn into a huge artifact
        git --literal-pathspecs ls-files -z --cached --others --exclude-standard -- "${PATHS[@]}" |
          while IFS= read -r -d '' FILE; do
            # a tracked file that the regeneration deleted: apply-regenerated-files removes it
            if [[ -e "$FILE" || -L "$FILE" ]]; then
              cp -P --parents -- "$FILE" "$STAGE"
            fi
            # The artifact is a zip without the permissions: apply-regenerated-files restores them from this list
            if [[ -f "$FILE" && ! -L "$FILE" && -x "$FILE" ]]; then
              printf '%s\0' "$FILE" >> "$STAGE/.regenerated-files-executables"
            fi
          done

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/regenerated-files
        if-no-files-found: error
        include-hidden-files: true
        overwrite: true
        retention-days: 1
