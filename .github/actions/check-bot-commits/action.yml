name: Check bot commits
description: >
  Checks the commits of a Dependabot pull request: all are signed by GitHub, the first one comes from Dependabot, and
  the next ones come from the bot and only change the given paths. The approval of a Dependabot pull request survives
  its next commits, so a commit outside these paths must not reach the merge. Does nothing on another pull request

inputs:
  allowed-paths:
    description: Extended regular expression of the paths the bot may change
    required: true
  repository:
    description: Repository of the pull request
    required: false
    default: ${{ github.repository }}
  pull-request:
    description: Number of the pull request
    required: false
    default: ${{ github.event.pull_request.number }}
  bot:
    description: Login of the author of the commits added to the pull request
    required: false
    default: litote-release-please-bot[bot]
  token:
    description: Token that reads the pull request
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check the commits
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        PULL_REQUEST: ${{ inputs.pull-request }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
        BOT: ${{ inputs.bot }}
      run: |
        AUTHOR=$(gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST" --jq '.user.login')
        if [[ "$AUTHOR" != 'dependabot[bot]' ]]; then
          echo "Not a Dependabot pull request."
          exit 0
        fi

        COMMITS="$RUNNER_TEMP/commits.tsv"
        gh api --paginate "repos/$REPOSITORY/pulls/$PULL_REQUEST/commits" \
          --jq '.[] | [.sha, .author.login // "unknown", .committer.login // "unknown", .commit.verification.verified]
            | @tsv' > "$COMMITS"

        INDEX=0
        FAILED=false
        while IFS=$'\t' read -r SHA LOGIN COMMITTER VERIFIED; do
          INDEX=$((INDEX + 1))
          # The author comes from the email of the commit, which anyone can set. A valid signature only vouches for
          # the committer: someone with write access can sign, with their own key, a commit whose author is the bot.
          # GitHub signs as web-flow, and only with the identity of the token that creates the commit: Dependabot
          # commits that way, and commit-via-api has GitHub sign those of the bot
          if [[ "$VERIFIED" != true || "$COMMITTER" != web-flow ]]; then
            echo "::error::Commit $SHA is not signed by GitHub"
            FAILED=true
            continue
          fi
          if [[ "$INDEX" == 1 ]]; then
            if [[ "$LOGIN" != 'dependabot[bot]' ]]; then
              echo "::error::The first commit $SHA comes from $LOGIN, not from Dependabot"
              FAILED=true
            fi
            continue
          fi

          if [[ "$LOGIN" != "$BOT" ]]; then
            echo "::error::Commit $SHA comes from $LOGIN, not from $BOT"
            FAILED=true
            continue
          fi

          # The paths are not printed: a name can hold a workflow command. The previous name of a renamed file
          # counts too: renaming a file into the allowed paths removes it from its own.
          # The response goes to a file first: a failed call must fail the check, not count as 0 file. The names
          # end with NUL so that a name with a newline stays one name. || true only covers grep, which exits 1 on 0
          FILES="$RUNNER_TEMP/commit-files.json"
          gh api --paginate "repos/$REPOSITORY/commits/$SHA" > "$FILES"
          UNEXPECTED=$(jq -j '.files[] | .filename, (.previous_filename // empty) | . + "\u0000"' "$FILES" |
            { grep -z -c -v -E "$ALLOWED_PATHS" || true; })
          if [[ "$UNEXPECTED" != 0 ]]; then
            echo "::error::Commit $SHA changes $UNEXPECTED file(s) outside the allowed paths"
            FAILED=true
          fi
        done < "$COMMITS"

        if [[ "$INDEX" == 0 ]]; then
          echo "::error::No commit found"
          exit 1
        fi
        [[ "$FAILED" == false ]]
