name: Set up Gradle
description: Sets up the JDK and Gradle, with the Gradle cache settings shared by the Litote repositories

inputs:
  java-version:
    description: JDK version. Several versions, one per line, are installed; the last one is the default
    required: false
    default: '25'
  cache-encryption-key:
    description: Key that encrypts the configuration cache. Without it, the configuration cache is not saved
    required: false
    default: ''
  cache-read-only:
    description: When 'true', the Gradle cache is read but not written. By default, it is written on the default branch only
    required: false
    default: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin

    # cache-cleanup: never prevents eviction of dependency metadata files
    # (.module files) that the configuration cache fingerprints. When the configuration
    # cache is reused, dependency resolution is skipped and those files are not "accessed",
    # so the default on-success cleanup would remove them, invalidating the cache on the
    # next run with "file has been removed".
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
        cache-read-only: ${{ inputs.cache-read-only }}
        dependency-graph: disabled
        build-scan-publish: false
        cache-cleanup: never
