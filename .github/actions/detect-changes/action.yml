name: Detect code changes
description: >
  Tells whether the pull request or the pushed commits change code. Needs a checkout with fetch-depth 0

inputs:
  pattern:
    description: >
      Extended regular expression matched against the changed file paths. The default one covers a Gradle build: the
      sources, the resources, the build scripts and properties, the wrapper and the verification metadata
    required: false
    default: '\.(kt|kts|java|gradle|properties|xml|yml|yaml|toml)$|(^|/)src/[^/]+/resources/|^gradle/wrapper/'
  base-ref:
    description: >
      Base branch of the pull request, compared with HEAD from their merge base. Empty outside a pull request
    required: false
    default: ${{ github.base_ref }}
  before:
    description: >
      Commit before the push, compared with HEAD when there is no base-ref. When it is empty, null (a new branch) or
      not in the clone, only the last commit is compared
    required: false
    default: ${{ github.event.before }}

outputs:
  has-code-changes:
    description: "'true' if a changed file matches the pattern, 'false' otherwise"
    value: ${{ steps.detect.outputs.has-code-changes }}

runs:
  using: composite
  steps:
    - name: Detect code changes
      id: detect
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        BEFORE: ${{ inputs.before }}
        PATTERN: ${{ inputs.pattern }}
      run: |
        if [[ -n "$BASE_REF" ]]; then
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
        elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
          # every commit of the push, not only the last one
          CHANGED=$(git diff --name-only "$BEFORE" HEAD)
        elif git rev-parse --verify --quiet HEAD~1 > /dev/null; then
          CHANGED=$(git diff --name-only HEAD~1..HEAD)
        else
          # first commit: no parent, every file is new
          CHANGED=$(git ls-files)
        fi
        # A here-string rather than a pipe: grep -q stops at the first match, and with pipefail the SIGPIPE of a
        # long list written to the pipe would turn a match into 'false'
        if grep -qE "$PATTERN" <<< "$CHANGED"; then
          echo "has-code-changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-code-changes=false" >> "$GITHUB_OUTPUT"
        fi
