name: Check ABI additions
description: >
  Keeps the regenerated ABI dumps (Kotlin `updateKotlinAbi`) whose changes are backward compatible additions, and
  restores the others from the index. A dump is kept when its diff with the index only adds lines and none of them
  declares an abstract member, which breaks the code that implements the type: a removed or a modified line, which
  includes a moved one, needs a review. The dumps come from a job that ran untrusted code: they are only compared,
  never executed. Runs on Linux, in a git working tree

inputs:
  paths:
    description: Space-separated paths of the regenerated ABI dumps, tracked by git
    required: true

outputs:
  kept:
    description: Space-separated paths of the dumps that changed and were kept
    value: ${{ steps.check.outputs.kept }}
  restored:
    description: Space-separated paths of the dumps that were restored from the index
    value: ${{ steps.check.outputs.restored }}

runs:
  using: composite
  steps:
    - name: Check the ABI changes
      id: check
      shell: bash
      env:
        DUMP_PATHS: ${{ inputs.paths }}
      run: |
        read -ra PATHS <<< "$DUMP_PATHS"
        KEPT=()
        RESTORED=()
        for P in "${PATHS[@]}"; do
          if ! git cat-file -e ":$P" 2>/dev/null; then
            echo "::error::Not in the index: $P"
            exit 1
          fi
          if [[ ! -f "$P" || -L "$P" ]]; then
            echo "::error::Not a regular file: $P"
            exit 1
          fi
          OLD=$(mktemp)
          git show ":$P" > "$OLD"
          if cmp -s "$OLD" "$P"; then
            rm -f "$OLD"
            continue
          fi
          # --old-line-format and --new-line-format mark each line: '-' removed, '+' added
          CHANGES=$(diff --old-line-format='-%L' --new-line-format='+%L' --unchanged-line-format='' "$OLD" "$P" || true)
          rm -f "$OLD"
          if grep -q '^-' <<< "$CHANGES"; then
            echo "::warning file=$P::ABI dump not updated: lines removed or modified, a review is needed"
            RESTORED+=("$P")
          # Modifiers can come between abstract and the member in a klib dump: abstract suspend fun
          elif grep -Eq '^\+.*\babstract( [a-z]+)* (fun|val|var)\b' <<< "$CHANGES"; then
            echo "::warning file=$P::ABI dump not updated: an abstract member is added, a review is needed"
            RESTORED+=("$P")
          else
            echo "ABI additions kept: $P"
            KEPT+=("$P")
          fi
        done
        for P in "${RESTORED[@]}"; do
          git checkout -- "$P"
        done
        echo "kept=${KEPT[*]}" >> "$GITHUB_OUTPUT"
        echo "restored=${RESTORED[*]}" >> "$GITHUB_OUTPUT"
