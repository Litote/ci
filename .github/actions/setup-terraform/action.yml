name: Set up Terraform
description: >
  Sets up Terraform, pinned to an exact version, and runs terraform init. The providers come from the committed
  .terraform.lock.hcl: init fails when it does not match the constraints, instead of resolving other versions

inputs:
  working-directory:
    description: Directory of the Terraform configuration
    required: false
    default: infra
  state-bucket:
    description: S3 bucket of the state, passed as -backend-config="bucket=...". Without it, init uses the backend as configured
    required: false
    default: ''
  terraform-version:
    description: Exact Terraform version
    required: false
    default: '1.16.7'
  terraform-wrapper:
    description: When 'true', wraps the terraform binary to expose stdout, stderr and the exit code as step outputs
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Terraform ${{ inputs.terraform-version }}
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: ${{ inputs.terraform-wrapper }}

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STATE_BUCKET: ${{ inputs.state-bucket }}
      run: |
        args=(-input=false -lockfile=readonly)
        if [[ -n "$STATE_BUCKET" ]]; then
          args+=("-backend-config=bucket=$STATE_BUCKET")
        fi
        terraform init "${args[@]}"
