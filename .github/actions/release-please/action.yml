name: Release Please
description: >
  Runs release-please with a GitHub App token, so that its pull requests and tags trigger the workflows of the repository

inputs:
  app-id:
    description: GitHub App id
    required: true
  private-key:
    description: GitHub App private key
    required: true
  config-file:
    description: Path of the release-please configuration
    required: false
    default: release-please-config.json
  manifest-file:
    description: Path of the release-please manifest
    required: false
    default: .release-please-manifest.json

outputs:
  release_created:
    description: "'true' when this run created a release"
    value: ${{ steps.release-please.outputs.release_created }}
  tag_name:
    description: Tag of the created release
    value: ${{ steps.release-please.outputs.tag_name }}

runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write

    - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      id: release-please
      with:
        token: ${{ steps.app-token.outputs.token }}
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}
