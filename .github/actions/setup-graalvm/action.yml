name: Set up GraalVM
description: >
  Sets up GraalVM with native-image, and Gradle with the cache settings of setup-gradle. native-image compiles for
  the platform of the runner: run it on the architecture of the target

inputs:
  java-version:
    description: Java version of GraalVM
    required: false
    default: '25'
  distribution:
    description: GraalVM distribution, graalvm-community or graalvm (Oracle GraalVM)
    required: false
    default: graalvm-community
  cache-encryption-key:
    description: Key that encrypts the configuration cache. Without it, the configuration cache is not saved
    required: false
    default: ''
  cache-read-only:
    description: When 'true', the Gradle cache is read but not written. By default, it is written on the default branch only
    required: false
    default: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
  github-token:
    description: Token that downloads GraalVM from GitHub, without the rate limit of anonymous requests
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up GraalVM ${{ inputs.java-version }}
      uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        github-token: ${{ inputs.github-token }}
        native-image-job-reports: 'false'

    # same settings as setup-gradle: see the cache-cleanup comment there
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
        cache-read-only: ${{ inputs.cache-read-only }}
        dependency-graph: disabled
        build-scan-publish: false
        cache-cleanup: never
