name: Dependabot auto-merge

# The caller keeps the pull_request_target trigger and restricts its job to Dependabot:
#   if: github.event.pull_request.user.login == 'dependabot[bot]'
# No pull request code is checked out or executed here.

on:
  workflow_call:
    inputs:
      ecosystems:
        description: >
          Comma-separated Dependabot ecosystems to merge, as named by fetch-metadata: gradle, pub, npm_and_yarn. Keep
          github-actions out: those updates change code that runs in CI with the repository secrets
        type: string
        required: true
      exclude-dependencies:
        description: >
          Comma-separated patterns of the dependencies to keep out of the merge, matched against the names given by
          fetch-metadata, such as org.mongodb:*. A pull request that updates a matching dependency stays manual
        type: string
        required: false
        default: ''
    secrets:
      RELEASE_PLEASE_APP_ID:
        required: true
      RELEASE_PLEASE_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      # Also checks that the first commit of the PR is a signed Dependabot commit
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata

      - name: Check the excluded dependencies
        id: excluded
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          EXCLUDE_DEPENDENCIES: ${{ inputs.exclude-dependencies }}
        run: |
          IFS=',' read -ra NAMES <<< "$DEPENDENCY_NAMES"
          IFS=',' read -ra PATTERNS <<< "$EXCLUDE_DEPENDENCIES"
          MATCH=false
          for NAME in "${NAMES[@]}"; do
            for PATTERN in "${PATTERNS[@]}"; do
              # shellcheck disable=SC2053 # the pattern is a glob
              if [[ "${NAME// /}" == ${PATTERN// /} ]]; then
                echo "$NAME is excluded by $PATTERN"
                MATCH=true
              fi
            done
          done
          echo "match=$MATCH" >> "$GITHUB_OUTPUT"

      # A GitHub App token rather than GITHUB_TOKEN: a merge made with GITHUB_TOKEN does
      # not trigger the push workflows of main (CI, SNAPSHOT publication, release-please)
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: >-
          steps.excluded.outputs.match == 'false' &&
          contains(format(',{0},', inputs.ecosystems), format(',{0},', steps.metadata.outputs.package-ecosystem)) && (
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch')
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # The merge happens only once the required checks of the ruleset pass on the PR
      # head, so it waits for the commits pushed by the dependabot-* workflows
      - name: Approve and enable auto-merge
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
