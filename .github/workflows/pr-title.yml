name: PR title

on:
  workflow_call:

permissions: {}

jobs:
  semantic-pr-title:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
