name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: $/.github/workflows/pr-title.yml

  zizmor:
    permissions:
      contents: read
    uses: $/.github/workflows/zizmor.yml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history for the SonarCloud analysis (new code detection, blame)
          fetch-depth: 0

      # Dependabot pull requests have no access to the secret
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The macOS run matters most: publish-macos runs this action after the Linux artifacts are published,
  # and GNU and BSD sed differ
  set-release-version:
    name: set-release-version (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create gradle.properties
        run: |
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8' \
            'GROUP=org.example' \
            'VERSION_NAME=main-SNAPSHOT' \
            'POM_NAME=Example' > gradle.properties

      - uses: $/.github/actions/set-release-version
        with:
          tag: v1.2.3
          # \, & and | are special in the replacement of sed
          jvm-args: -Xmx6g -Dfile.encoding=UTF-8 -Dsample=a&b|c\d

      - name: Check gradle.properties
        run: |
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Dsample=a&b|c\d' \
            'GROUP=org.example' \
            'VERSION_NAME=1.2.3' \
            'POM_NAME=Example' > expected.properties
          diff expected.properties gradle.properties
          test ! -e gradle.properties.bak

      # Without org.gradle.jvmargs: the line is added
      - name: Remove org.gradle.jvmargs
        run: grep -v '^org.gradle.jvmargs=' gradle.properties > work.properties && mv work.properties gradle.properties

      - uses: $/.github/actions/set-release-version
        with:
          tag: v1.2.4
          jvm-args: -Xmx3g

      - name: Check the added JVM args
        run: |
          grep -qx 'VERSION_NAME=1.2.4' gradle.properties
          test "$(tail -n 1 gradle.properties)" = 'org.gradle.jvmargs=-Xmx3g'

      - uses: $/.github/actions/set-release-version
        id: invalid-tag
        continue-on-error: true
        with:
          tag: v1.2.3/evil

      - name: Remove VERSION_NAME
        run: |
          grep -v '^VERSION_NAME=' gradle.properties > gradle.properties.tmp
          mv gradle.properties.tmp gradle.properties

      - uses: $/.github/actions/set-release-version
        id: missing-version
        continue-on-error: true
        with:
          tag: v1.2.3

      - name: Check the rejected cases
        env:
          INVALID_TAG: ${{ steps.invalid-tag.outcome }}
          MISSING_VERSION: ${{ steps.missing-version.outcome }}
        run: |
          test "$INVALID_TAG" = failure
          test "$MISSING_VERSION" = failure

  # The action of gradle-check.yml, whose script set-release-version runs too: GNU and BSD sed differ
  set-gradle-jvm-args:
    name: set-gradle-jvm-args (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A line to replace, a file without the line and without a final newline, and no file at all
      - name: Create the properties files
        run: |
          mkdir -p work/replaced work/added work/created
          printf '%s\n' 'org.gradle.jvmargs=-Xmx8g' 'GROUP=org.example' > work/replaced/gradle.properties
          mkdir -p work/continued
          # a value on several lines: its continuation lines go with it
          # shellcheck disable=SC1003 # the \ ends the line of the properties file
          printf '%s\n' 'org.gradle.jvmargs=-Xmx8g \' '  -Dfile.encoding=UTF-8' 'GROUP=org.example' > work/continued/gradle.properties
          printf '%s' 'GROUP=org.example' > work/added/gradle.properties

      - uses: $/.github/actions/set-gradle-jvm-args
        with:
          file: work/replaced/gradle.properties
          # \, & and | are special in the replacement of sed
          jvm-args: -Xmx3g -Dsample=a&b|c\d

      - uses: $/.github/actions/set-gradle-jvm-args
        with:
          file: work/continued/gradle.properties
          jvm-args: -Xmx3g

      - uses: $/.github/actions/set-gradle-jvm-args
        with:
          file: work/added/gradle.properties
          jvm-args: -Xmx3g -Dsample=a&b|c\d

      - uses: $/.github/actions/set-gradle-jvm-args
        with:
          file: work/created/gradle.properties
          jvm-args: -Xmx3g

      - uses: $/.github/actions/set-gradle-jvm-args
        id: empty
        continue-on-error: true
        with:
          file: work/created/gradle.properties
          jvm-args: ''

      - name: Check the properties files
        env:
          EMPTY: ${{ steps.empty.outcome }}
        run: |
          diff <(printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -Dsample=a&b|c\d' 'GROUP=org.example') work/replaced/gradle.properties
          diff <(printf '%s\n' 'GROUP=org.example' 'org.gradle.jvmargs=-Xmx3g -Dsample=a&b|c\d') work/added/gradle.properties
          diff <(printf '%s\n' 'org.gradle.jvmargs=-Xmx3g') work/created/gradle.properties
          diff <(printf '%s\n' 'org.gradle.jvmargs=-Xmx3g' 'GROUP=org.example') work/continued/gradle.properties
          test ! -e work/replaced/gradle.properties.tmp
          test "$EMPTY" = failure

  # Upload and apply run in two jobs, like their callers: downloading an artifact in the job that has just
  # uploaded it fails intermittently ("Artifact not found for name"). The upload runs on macOS too, like in
  # flutter-update-goldens.yml, whose files are then applied on Linux
  regenerated-files-upload:
    name: regenerated-files-upload (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the regenerated files
        run: |
          mkdir -p work/dir/sub
          echo file > work/file.txt
          echo kept > work/dir/sub/kept.txt
          echo hidden > work/dir/.hidden
          echo run > work/dir/run.sh
          chmod +x work/dir/run.sh
          echo other > work/other.txt
          mkdir -p work/dir/build
          echo output > work/dir/build/output.txt
          # ignored by git without adding a file to the regenerated paths
          mkdir -p .git/info
          echo /work/dir/build/ >> .git/info/exclude
          mkdir -p work/invalid
          echo invalid > "work/invalid/$(printf 'a\tb')"

      - uses: $/.github/actions/upload-regenerated-files
        with:
          name: regenerated-files-${{ matrix.os }}
          paths: work/file.txt work/dir

      - uses: $/.github/actions/upload-regenerated-files
        with:
          name: invalid-file-name-${{ matrix.os }}
          paths: work/invalid

  regenerated-files:
    name: regenerated-files (from ${{ matrix.os }})
    needs: regenerated-files-upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create stale files
        run: |
          mkdir -p work/dir
          echo stale > work/dir/removed.txt
          echo untouched > work/other.txt

      - uses: $/.github/actions/apply-regenerated-files
        with:
          name: regenerated-files-${{ matrix.os }}
          paths: work/file.txt work/dir

      - name: Check the applied files
        run: |
          test "$(cat work/file.txt)" = file
          test "$(cat work/dir/sub/kept.txt)" = kept
          test "$(cat work/dir/.hidden)" = hidden
          test "$(cat work/other.txt)" = untouched
          # the artifact loses the permissions: restored from the list of upload-regenerated-files
          test -x work/dir/run.sh
          test ! -x work/dir/sub/kept.txt
          test ! -e work/dir/removed.txt
          # ignored by git: never handed over
          test ! -e work/dir/build

      - uses: $/.github/actions/apply-regenerated-files
        id: missing-path
        continue-on-error: true
        with:
          name: regenerated-files-${{ matrix.os }}
          paths: work/missing.txt

      - uses: $/.github/actions/apply-regenerated-files
        id: invalid-name
        continue-on-error: true
        with:
          name: invalid-file-name-${{ matrix.os }}
          paths: work/invalid

      - name: Check the rejected cases
        env:
          MISSING_PATH: ${{ steps.missing-path.outcome }}
          INVALID_NAME: ${{ steps.invalid-name.outcome }}
        run: |
          test "$MISSING_PATH" = failure
          # download-artifact replaces a tab in a name: either way, it must not reach the working directory
          if [[ "$INVALID_NAME" == success ]]; then
            test -z "$(LC_ALL=C find work/invalid -name '*[[:cntrl:]]*')"
          fi

  docker-publish:
    name: docker-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # a RUN in the target platforms (emulated for arm64), a named context and a build argument
      - name: Create the image files
        run: |
          mkdir -p work/app work/conf
          echo app > work/app/app.txt
          echo conf > work/conf/conf.txt
          cat > work/Dockerfile.test <<'DOCKERFILE'
          FROM busybox:1.37
          ARG GREETING
          COPY --from=conf conf.txt /conf.txt
          COPY app.txt /app.txt
          RUN test "$GREETING" = hello && uname -m > /arch
          DOCKERFILE

      - uses: $/.github/actions/docker-publish
        id: publish
        with:
          image: ghcr.io/litote/ci-test
          tags: |
            type=semver,pattern={{version}},value=1.2.3
            type=semver,pattern={{major}}.{{minor}},value=1.2.3
          context: work/app
          file: work/Dockerfile.test
          build-contexts: conf=work/conf
          build-args: GREETING=hello
          emulate: 'true'
          push: 'false'

      - name: Check the outputs
        env:
          TAGS: ${{ steps.publish.outputs.tags }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          test "$VERSION" = 1.2.3
          diff <(printf '%s\n' ghcr.io/litote/ci-test:1.2.3 ghcr.io/litote/ci-test:1.2) <(printf '%s\n' "$TAGS")

  app-token:
    name: app-token
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Dependabot pull requests have no access to the secrets
      - name: Secrets available
        id: secrets
        env:
          AVAILABLE: ${{ secrets.RELEASE_PLEASE_APP_ID != '' }}
        run: echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/app-token
        id: token
        if: steps.secrets.outputs.available == 'true'
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-pull-requests: read

      - name: Check the token
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # the current repository only
          test "$(gh api /installation/repositories --jq '[.repositories[].full_name] | join(",")')" = "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/pulls?per_page=1" > /dev/null

      # No permission, permission-contents emptied explicitly: refused before any token is created. With the real
      # secrets, so that a broken check, or an empty value replaced by the default write, would create a token (with
      # every permission of the App in the first case, revoked at the end of the job) and fail the check below
      - uses: $/.github/actions/app-token
        id: no-permission
        if: steps.secrets.outputs.available == 'true'
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: ''

      - name: Check the rejected case
        if: steps.secrets.outputs.available == 'true'
        env:
          NO_PERMISSION: ${{ steps.no-permission.outcome }}
          NO_PERMISSION_TOKEN: ${{ steps.no-permission.outputs.token }}
        run: |
          test "$NO_PERMISSION" = failure
          test -z "$NO_PERMISSION_TOKEN"

  # On a branch of its own, created from a commit without parent, so without the workflows, and deleted at the end
  commit-via-api:
    name: commit-via-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Dependabot pull requests have no access to the secrets
      - name: Secrets available
        id: secrets
        env:
          AVAILABLE: ${{ secrets.RELEASE_PLEASE_APP_ID != '' }}
        run: echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/app-token
        id: token
        if: steps.secrets.outputs.available == 'true'
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Create the branch
        id: branch
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ci-test/commit-via-api-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          TREE=$(jq -n '{tree: [
              {path: "work/kept.txt", mode: "100644", type: "blob", content: "kept\n"},
              {path: "work/removed.txt", mode: "100644", type: "blob", content: "removed\n"},
              {path: "work/script.sh", mode: "100644", type: "blob", content: "old\n"}
            ]}' | gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" \
            --raw-field message='test: base of commit-via-api' --raw-field tree="$TREE" --jq '.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field ref="refs/heads/$BRANCH" --raw-field sha="$BASE" --silent
          {
            echo "name=$BRANCH"
            echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"

      # The same files in a local repository, then changed: a removal, an addition, an executable and a symbolic link
      - name: Change the files
        if: steps.secrets.outputs.available == 'true'
        run: |
          git init --quiet
          mkdir work
          echo kept > work/kept.txt
          echo removed > work/removed.txt
          echo old > work/script.sh
          git add --all
          git -c user.name=ci -c user.email=ci@example.invalid commit --quiet --message base
          rm work/removed.txt
          echo new > work/script.sh
          chmod +x work/script.sh
          echo new > work/new.txt
          ln -s new.txt work/link

      # A message starting with @, which --field would read as a file
      - uses: $/.github/actions/commit-via-api
        if: steps.secrets.outputs.available == 'true'
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ steps.branch.outputs.name }}
          paths: work
          message: '@ci-test'
          expected-head: ${{ steps.branch.outputs.base }}

      - name: Check the commit
        id: commit
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD" \
            --jq '[.message, .parents[0].sha, .verification.verified] | @tsv' > "$RUNNER_TEMP/commit.tsv"
          diff <(printf '%s\t%s\t%s\n' '@ci-test' "$BASE" true) "$RUNNER_TEMP/commit.tsv"
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$HEAD?recursive=1" --jq '.tree' > "$RUNNER_TEMP/tree.json"
          jq -r '.[] | select(.type == "blob") | "\(.mode) \(.path)"' "$RUNNER_TEMP/tree.json" | sort > "$RUNNER_TEMP/tree.txt"
          diff <(printf '%s\n' '100644 work/kept.txt' '100644 work/new.txt' '100755 work/script.sh' '120000 work/link' | sort) "$RUNNER_TEMP/tree.txt"
          # The blob of the link rather than the contents API, which follows a link to a file of the repository
          LINK_SHA=$(jq -r '.[] | select(.path == "work/link") | .sha' "$RUNNER_TEMP/tree.json")
          LINK=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs/$LINK_SHA" --jq '.content' | base64 --decode)
          test "$LINK" = new.txt
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      # The branch already has this content: no empty commit
      - uses: $/.github/actions/commit-via-api
        if: steps.secrets.outputs.available == 'true'
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ steps.branch.outputs.name }}
          paths: work
          message: 'test: same content'

      - name: Change a file again
        if: steps.secrets.outputs.available == 'true'
        run: echo newer > work/new.txt

      # The branch moved since the base: the changes are stale
      - uses: $/.github/actions/commit-via-api
        if: steps.secrets.outputs.available == 'true'
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ steps.branch.outputs.name }}
          paths: work
          message: 'test: stale changes'
          expected-head: ${{ steps.branch.outputs.base }}

      - name: Check that nothing else was committed
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          HEAD: ${{ steps.commit.outputs.head }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$HEAD"

      - name: Delete the branch
        if: always() && steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" --method DELETE

  # The checks of dependabot-auto-merge.yml that decide a merge: the digest-only detection, against patches in the
  # format of the pull request files API, and the glob patterns of exclude-dependencies
  dependabot-auto-merge-checks:
    name: dependabot-auto-merge-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the digest-only detection
        run: |
          OLD="@sha256:$(printf 'a%.0s' {1..64})"
          NEW="@sha256:$(printf 'b%.0s' {1..64})"
          check() {
            local expected="$1" patch="$2"
            test "$(printf '%s\n' "$patch" | bash .github/actions/check-docker-digest/digest-only.sh)" = "$expected"
          }
          check true "$(printf '%s\n' '@@ -1,2 +1,2 @@' ' # base' "-FROM busybox:1.37$OLD" "+FROM busybox:1.37$NEW")"
          check false "$(printf '%s\n' '@@ -1 +1 @@' "-FROM busybox:1.37$OLD" "+FROM busybox:1.38$NEW")"
          # the same lines in another order: not a digest bump
          check false "$(printf '%s\n' '@@ -1,2 +1,2 @@' "-FROM a:1$OLD" "-FROM b:1$OLD" "+FROM b:1$NEW" "+FROM a:1$NEW")"
          # a file without a patch, as the action writes it
          check false "$(printf '%s\n' '@@ -1 +1 @@' "-FROM busybox:1.37$OLD" "+FROM busybox:1.37$NEW" '+no patch')"
          check false "$(printf '%s\n' '@@ -1 +1 @@' '-FROM busybox:1.37' '+FROM busybox:1.38')"
          check false ''

      - uses: $/.github/actions/check-excluded-dependencies
        id: excluded
        with:
          dependency-names: io.ktor:ktor-client-core, org.mongodb:mongodb-driver-sync
          exclude-dependencies: com.example:*, org.mongodb:*

      - uses: $/.github/actions/check-excluded-dependencies
        id: not-excluded
        with:
          dependency-names: io.ktor:ktor-client-core,org.mongodb.kbson:kbson
          exclude-dependencies: org.mongodb:*

      - uses: $/.github/actions/check-excluded-dependencies
        id: no-pattern
        with:
          dependency-names: org.mongodb:mongodb-driver-sync
          exclude-dependencies: ''

      - name: Check the excluded dependencies
        env:
          EXCLUDED: ${{ steps.excluded.outputs.match }}
          NOT_EXCLUDED: ${{ steps.not-excluded.outputs.match }}
          NO_PATTERN: ${{ steps.no-pattern.outputs.match }}
        run: |
          test "$EXCLUDED" = true
          test "$NOT_EXCLUDED" = false
          test "$NO_PATTERN" = false

  # Against a merged Dependabot pull request: one commit of Dependabot and two of the bot. These pull requests of
  # other public repositories must stay public and must not be deleted: replace them here first
  check-bot-commits:
    name: check-bot-commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: $/.github/actions/check-bot-commits
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '126'
          allowed-paths: ^(gradle/verification-metadata\.xml|e2e-split/kotlin-js-store/(wasm/)?yarn\.lock)$

      - uses: $/.github/actions/check-bot-commits
        id: unexpected-path
        continue-on-error: true
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '126'
          allowed-paths: ^gradle/verification-metadata\.xml$

      - uses: $/.github/actions/check-bot-commits
        id: unexpected-bot
        continue-on-error: true
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '126'
          allowed-paths: .*
          bot: another-bot[bot]

      # Its second commit is signed with the key of its author: refused even with that author as the bot
      - uses: $/.github/actions/check-bot-commits
        id: not-signed-by-github
        continue-on-error: true
        with:
          repository: Litote/mastodon-ktor-sdk
          pull-request: '81'
          allowed-paths: .*
          bot: zigzago

      # Not a Dependabot pull request: allowed whatever the paths
      - uses: $/.github/actions/check-bot-commits
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '125'
          allowed-paths: ^$

      - name: Check the rejected cases
        env:
          UNEXPECTED_PATH: ${{ steps.unexpected-path.outcome }}
          UNEXPECTED_BOT: ${{ steps.unexpected-bot.outcome }}
          NOT_SIGNED_BY_GITHUB: ${{ steps.not-signed-by-github.outcome }}
        run: |
          test "$UNEXPECTED_PATH" = failure
          test "$UNEXPECTED_BOT" = failure
          test "$NOT_SIGNED_BY_GITHUB" = failure

  # Against dumps added to the index of the checkout, then regenerated in the working directory
  check-abi-additions:
    name: check-abi-additions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # %b turns the \t into a tab, as in a real dump
      - name: Create the dumps
        run: |
          CLASS='public final class org/example/A {'
          FOO='\tpublic fun foo ()V'
          mkdir -p work/unchanged/api work/added/api work/removed/api work/abstract/api work/suspend/api work/binary/api
          printf '%b\n' "$CLASS" "$FOO" '}' > base.api
          for M in unchanged added removed abstract suspend binary; do cp base.api "work/$M/api/$M.api"; done
          rm base.api
          git add work
          printf '%b\n' "$CLASS" "$FOO" '\tpublic fun getApiFeatures ()Lorg/example/F;' '}' > work/added/api/added.api
          printf '%b\n' "$CLASS" '}' > work/removed/api/removed.api
          printf '%b\n' "$CLASS" "$FOO" '}' 'public abstract interface class org/example/I {' '\tpublic abstract fun bar ()V' '}' \
            > work/abstract/api/abstract.api
          printf '%b\n' "$CLASS" "$FOO" '}' '\tabstract suspend fun emit(): kotlin/Unit // org.example/I.emit|emit(){}[0]' \
            > work/suspend/api/suspend.api
          # Only an added line, but with a NUL byte: diff would see a binary file
          printf '%b\n' "$CLASS" "$FOO" '\tpublic fun bar\0 ()V' '}' > work/binary/api/binary.api

      - uses: $/.github/actions/check-abi-additions
        id: check
        with:
          paths: >-
            work/unchanged/api/unchanged.api work/added/api/added.api work/removed/api/removed.api
            work/abstract/api/abstract.api work/suspend/api/suspend.api work/binary/api/binary.api

      - name: Check the kept and restored dumps
        env:
          KEPT: ${{ steps.check.outputs.kept }}
          RESTORED: ${{ steps.check.outputs.restored }}
        run: |
          test "$KEPT" = work/added/api/added.api
          test "$RESTORED" = \
            'work/removed/api/removed.api work/abstract/api/abstract.api work/suspend/api/suspend.api work/binary/api/binary.api'
          grep -q getApiFeatures work/added/api/added.api
          git diff --quiet -- work/unchanged work/removed work/abstract work/suspend work/binary

      - uses: $/.github/actions/check-abi-additions
        id: untracked
        continue-on-error: true
        with:
          paths: work/untracked.api

      - name: Check the rejected case
        env:
          UNTRACKED: ${{ steps.untracked.outcome }}
        run: test "$UNTRACKED" = failure

  # Against a history built in the job: base-ref and before stand for the pull request and the push events
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Create the history
        id: history
        run: |
          git init --quiet --initial-branch main
          git config user.name ci
          git config user.email ci@example.invalid
          commit() {
            local message="$1"
            git add --all
            git commit --quiet --message "$message"
          }
          echo first > first.kt
          commit first
          echo "first=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo code > code.kt
          commit code
          echo docs > docs.md
          commit docs
          echo "last=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # the base branch of the pull request
          git update-ref refs/remotes/origin/main "$(git rev-parse HEAD~2)"

      # A push of the code and docs commits: HEAD~1 alone would only see docs.md
      - uses: $/.github/actions/detect-changes
        id: push
        with:
          base-ref: ''
          before: ${{ steps.history.outputs.first }}

      - uses: $/.github/actions/detect-changes
        id: push-last-commit
        with:
          base-ref: ''
          before: ${{ steps.history.outputs.last }}~1

      # A new branch, and a commit missing from the clone: the last commit only
      - uses: $/.github/actions/detect-changes
        id: new-branch
        with:
          base-ref: ''
          before: '0000000000000000000000000000000000000000'

      - uses: $/.github/actions/detect-changes
        id: unknown-before
        with:
          base-ref: ''
          before: 1111111111111111111111111111111111111111

      - uses: $/.github/actions/detect-changes
        id: pull-request
        with:
          base-ref: main
          before: ''

      - uses: $/.github/actions/detect-changes
        id: pattern
        with:
          pattern: '\.md$'
          base-ref: ''
          before: ${{ steps.history.outputs.last }}~1

      # A list longer than the pipe buffer, code.kt sorted first: grep -q stops before reading it all
      - name: Change many files
        run: |
          echo changed > code.kt
          mkdir docs
          for i in $(seq 10000); do echo "$i" > "docs/page-$i.md"; done
          git add --all
          git commit --quiet --message many

      - uses: $/.github/actions/detect-changes
        id: many-files
        with:
          base-ref: ''
          before: ''

      # Files of a Gradle build without a source extension: the wrapper, then a resource
      - name: Change the Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          echo distributionUrl=gradle-9.zip > gradle/wrapper/gradle-wrapper.properties
          git add --all
          git commit --quiet --message wrapper

      - uses: $/.github/actions/detect-changes
        id: wrapper
        with:
          base-ref: ''
          before: ''

      - name: Change a resource
        run: |
          mkdir -p module/src/main/resources
          echo template > module/src/main/resources/template.html
          git add --all
          git commit --quiet --message resource

      - uses: $/.github/actions/detect-changes
        id: resource
        with:
          base-ref: ''
          before: ''

      - name: Change a Compose Multiplatform resource
        run: |
          mkdir -p module/src/commonMain/composeResources/values
          echo '<resources/>' > module/src/commonMain/composeResources/values/strings.txt
          git add --all
          git commit --quiet --message compose-resource

      - uses: $/.github/actions/detect-changes
        id: compose-resource
        with:
          base-ref: ''
          before: ''

      - name: Check the outputs
        env:
          COMPOSE_RESOURCE: ${{ steps.compose-resource.outputs.has-code-changes }}
          WRAPPER: ${{ steps.wrapper.outputs.has-code-changes }}
          RESOURCE: ${{ steps.resource.outputs.has-code-changes }}
          PUSH: ${{ steps.push.outputs.has-code-changes }}
          PUSH_LAST_COMMIT: ${{ steps.push-last-commit.outputs.has-code-changes }}
          NEW_BRANCH: ${{ steps.new-branch.outputs.has-code-changes }}
          UNKNOWN_BEFORE: ${{ steps.unknown-before.outputs.has-code-changes }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.has-code-changes }}
          PATTERN: ${{ steps.pattern.outputs.has-code-changes }}
          MANY_FILES: ${{ steps.many-files.outputs.has-code-changes }}
        run: |
          test "$PUSH" = true
          test "$PUSH_LAST_COMMIT" = false
          test "$NEW_BRANCH" = false
          test "$UNKNOWN_BEFORE" = false
          test "$PULL_REQUEST" = true
          test "$PATTERN" = true
          test "$MANY_FILES" = true
          test "$WRAPPER" = true
          test "$RESOURCE" = true
          test "$COMPOSE_RESOURCE" = true

  # Against a ./gradlew that records its arguments: the tasks, and the pull request parameters of the analysis
  sonar-gradle:
    name: sonar-gradle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Create the Gradle wrapper
        run: |
          # shellcheck disable=SC2016 # expanded by the wrapper, not here
          printf '%s\n' '#!/usr/bin/env bash' 'printf "%s\n" "$*" >> "$RUNNER_TEMP/gradlew.log"' > gradlew
          chmod +x gradlew

      # Without a token, as on Dependabot pull requests: nothing runs
      - uses: $/.github/actions/sonar-gradle
        with:
          sonar-token: ''

      - name: Check that nothing ran
        run: test ! -e "$RUNNER_TEMP/gradlew.log"

      - uses: $/.github/actions/sonar-gradle
        with:
          sonar-token: fake

      - name: Check the Gradle invocations
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            SONAR="sonar --no-configuration-cache -Dsonar.pullrequest.key=$PR_NUMBER"
            SONAR="$SONAR -Dsonar.pullrequest.branch=$PR_BRANCH -Dsonar.pullrequest.base=$PR_BASE"
          else
            SONAR='sonar --no-configuration-cache'
          fi
          diff <(printf '%s\n' 'jacocoAggregatedReport --no-configuration-cache' "$SONAR") "$RUNNER_TEMP/gradlew.log"

  setup-terraform:
    name: setup-terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the configurations
        run: |
          mkdir -p work/no-provider work/unlocked
          echo 'terraform {}' > work/no-provider/main.tf
          printf '%s\n' \
            'terraform {' \
            '  required_providers {' \
            '    null = { source = "hashicorp/null", version = "~> 3.2" }' \
            '  }' \
            '}' > work/unlocked/main.tf

      - uses: $/.github/actions/setup-terraform
        with:
          working-directory: work/no-provider

      - name: Check the Terraform version
        working-directory: work/no-provider
        run: terraform version -json | jq -e '.terraform_version == "1.16.7"'

      # without .terraform.lock.hcl, init must not resolve the provider
      - uses: $/.github/actions/setup-terraform
        id: unlocked
        continue-on-error: true
        with:
          working-directory: work/unlocked

      - name: Check the rejected cases
        env:
          UNLOCKED: ${{ steps.unlocked.outcome }}
        run: test "$UNLOCKED" = failure

  setup-mkdocs:
    name: setup-mkdocs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mkdocs

      - name: Create the sites
        run: |
          mkdir -p work/valid/docs work/broken-link/docs
          for site in valid broken-link; do
            printf '%s\n' "site_name: ${site}" 'theme:' '  name: material' > "work/${site}/mkdocs.yml"
          done
          echo '# Home' > work/valid/docs/index.md
          echo '[missing](missing.md)' > work/broken-link/docs/index.md

      - name: Build the valid site
        working-directory: work/valid
        run: |
          mkdocs build --strict
          test -f site/index.html

      # --strict must fail on a broken link
      - name: Build the site with a broken link
        id: broken-link
        continue-on-error: true
        working-directory: work/broken-link
        run: mkdocs build --strict

      - name: Check the rejected cases
        env:
          BROKEN_LINK: ${{ steps.broken-link.outcome }}
        run: test "$BROKEN_LINK" = failure

  # arm64 runner: the native image is checked against the architecture it is compiled for
  setup-graalvm:
    name: setup-graalvm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-graalvm

      - name: Compile a native image
        run: |
          mkdir -p work
          cd work
          printf '%s\n' 'public class Hello {' \
            '  public static void main(String[] args) { System.out.println("hello"); }' \
            '}' > Hello.java
          javac Hello.java
          native-image --version
          native-image -cp . Hello hello
          test "$(./hello)" = hello

      - name: Check the JDK
        run: |
          java -version 2>&1 | tee version.txt
          grep -q 'GraalVM CE' version.txt
          grep -q 'version "25' version.txt

      - uses: $/.github/actions/check-native-arch
        with:
          working-directory: work
          binaries: hello

      - uses: $/.github/actions/check-native-arch
        id: wrong-architecture
        continue-on-error: true
        with:
          working-directory: work
          binaries: hello
          architecture: x86_64

      - uses: $/.github/actions/check-native-arch
        id: missing-binary
        continue-on-error: true
        with:
          working-directory: work
          binaries: |
            hello
            missing

      - uses: $/.github/actions/check-native-arch
        id: unknown-architecture
        continue-on-error: true
        with:
          working-directory: work
          binaries: hello
          architecture: riscv64

      - name: Check the rejected cases
        env:
          WRONG_ARCHITECTURE: ${{ steps.wrong-architecture.outcome }}
          MISSING_BINARY: ${{ steps.missing-binary.outcome }}
          UNKNOWN_ARCHITECTURE: ${{ steps.unknown-architecture.outcome }}
        run: |
          test "$WRONG_ARCHITECTURE" = failure
          test "$MISSING_BINARY" = failure
          test "$UNKNOWN_ARCHITECTURE" = failure
