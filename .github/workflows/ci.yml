name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: $/.github/workflows/pr-title.yml

  zizmor:
    permissions:
      contents: read
    uses: $/.github/workflows/zizmor.yml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history for the SonarCloud analysis (new code detection, blame)
          fetch-depth: 0

      # Dependabot pull requests have no access to the secret
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The macOS run matters most: publish-macos runs this action after the Linux artifacts are published,
  # and GNU and BSD sed differ
  set-release-version:
    name: set-release-version (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create gradle.properties
        run: |
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8' \
            'GROUP=org.example' \
            'VERSION_NAME=main-SNAPSHOT' \
            'POM_NAME=Example' > gradle.properties

      - uses: $/.github/actions/set-release-version
        with:
          tag: v1.2.3
          jvm-args: -Xmx6g -Dfile.encoding=UTF-8

      - name: Check gradle.properties
        run: |
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' \
            'GROUP=org.example' \
            'VERSION_NAME=1.2.3' \
            'POM_NAME=Example' > expected.properties
          diff expected.properties gradle.properties
          test ! -e gradle.properties.bak

      - uses: $/.github/actions/set-release-version
        id: invalid-tag
        continue-on-error: true
        with:
          tag: v1.2.3/evil

      - name: Remove VERSION_NAME
        run: |
          grep -v '^VERSION_NAME=' gradle.properties > gradle.properties.tmp
          mv gradle.properties.tmp gradle.properties

      - uses: $/.github/actions/set-release-version
        id: missing-version
        continue-on-error: true
        with:
          tag: v1.2.3

      - name: Check the rejected cases
        env:
          INVALID_TAG: ${{ steps.invalid-tag.outcome }}
          MISSING_VERSION: ${{ steps.missing-version.outcome }}
        run: |
          test "$INVALID_TAG" = failure
          test "$MISSING_VERSION" = failure

  regenerated-files:
    name: regenerated-files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the regenerated files
        run: |
          mkdir -p work/dir/sub
          echo file > work/file.txt
          echo kept > work/dir/sub/kept.txt
          echo hidden > work/dir/.hidden
          echo other > work/other.txt

      - uses: $/.github/actions/upload-regenerated-files
        with:
          paths: work/file.txt work/dir

      - name: Change the working directory
        run: |
          rm -rf work
          mkdir -p work/dir
          echo stale > work/dir/removed.txt
          echo untouched > work/other.txt

      - uses: $/.github/actions/apply-regenerated-files
        with:
          paths: work/file.txt work/dir

      - name: Check the applied files
        run: |
          test "$(cat work/file.txt)" = file
          test "$(cat work/dir/sub/kept.txt)" = kept
          test "$(cat work/dir/.hidden)" = hidden
          test "$(cat work/other.txt)" = untouched
          test ! -e work/dir/removed.txt

      - uses: $/.github/actions/apply-regenerated-files
        id: missing-path
        continue-on-error: true
        with:
          paths: work/missing.txt

      - name: Create a name with a control character
        run: |
          mkdir -p work/invalid
          echo invalid > "work/invalid/$(printf 'a\tb')"

      - uses: $/.github/actions/upload-regenerated-files
        with:
          name: invalid-file-name
          paths: work/invalid

      - uses: $/.github/actions/apply-regenerated-files
        id: invalid-name
        continue-on-error: true
        with:
          name: invalid-file-name
          paths: work/invalid

      - name: Check the rejected cases
        env:
          MISSING_PATH: ${{ steps.missing-path.outcome }}
          INVALID_NAME: ${{ steps.invalid-name.outcome }}
        run: |
          test "$MISSING_PATH" = failure
          # download-artifact replaces a tab in a name: either way, it must not reach the working directory
          if [[ "$INVALID_NAME" == success ]]; then
            test -z "$(LC_ALL=C find work/invalid -name '*[[:cntrl:]]*')"
          fi

  # Against a merged Dependabot pull request: one commit of Dependabot and two of the bot
  check-bot-commits:
    name: check-bot-commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: $/.github/actions/check-bot-commits
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '126'
          allowed-paths: ^(gradle/verification-metadata\.xml|e2e-split/kotlin-js-store/(wasm/)?yarn\.lock)$

      - uses: $/.github/actions/check-bot-commits
        id: unexpected-path
        continue-on-error: true
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '126'
          allowed-paths: ^gradle/verification-metadata\.xml$

      - uses: $/.github/actions/check-bot-commits
        id: unexpected-bot
        continue-on-error: true
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '126'
          allowed-paths: .*
          bot: another-bot[bot]

      # Not a Dependabot pull request: allowed whatever the paths
      - uses: $/.github/actions/check-bot-commits
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '125'
          allowed-paths: ^$

      - name: Check the rejected cases
        env:
          UNEXPECTED_PATH: ${{ steps.unexpected-path.outcome }}
          UNEXPECTED_BOT: ${{ steps.unexpected-bot.outcome }}
        run: |
          test "$UNEXPECTED_PATH" = failure
          test "$UNEXPECTED_BOT" = failure

  setup-terraform:
    name: setup-terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the configurations
        run: |
          mkdir -p work/no-provider work/unlocked
          echo 'terraform {}' > work/no-provider/main.tf
          printf '%s\n' \
            'terraform {' \
            '  required_providers {' \
            '    null = { source = "hashicorp/null", version = "~> 3.2" }' \
            '  }' \
            '}' > work/unlocked/main.tf

      - uses: $/.github/actions/setup-terraform
        with:
          working-directory: work/no-provider

      - name: Check the Terraform version
        working-directory: work/no-provider
        run: terraform version -json | jq -e '.terraform_version == "1.16.7"'

      # without .terraform.lock.hcl, init must not resolve the provider
      - uses: $/.github/actions/setup-terraform
        id: unlocked
        continue-on-error: true
        with:
          working-directory: work/unlocked

      - name: Check the rejected cases
        env:
          UNLOCKED: ${{ steps.unlocked.outcome }}
        run: test "$UNLOCKED" = failure
