name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: $/.github/workflows/pr-title.yml

  zizmor:
    permissions:
      contents: read
    uses: $/.github/workflows/zizmor.yml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history for the SonarCloud analysis (new code detection, blame)
          fetch-depth: 0

      # Dependabot pull requests have no access to the secret
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The macOS run matters most: publish-macos runs this action after the Linux artifacts are published,
  # and GNU and BSD sed differ
  set-release-version:
    name: set-release-version (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create gradle.properties
        run: |
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8' \
            'GROUP=org.example' \
            'VERSION_NAME=main-SNAPSHOT' \
            'POM_NAME=Example' > gradle.properties

      - uses: $/.github/actions/set-release-version
        with:
          tag: v1.2.3
          jvm-args: -Xmx6g -Dfile.encoding=UTF-8

      - name: Check gradle.properties
        run: |
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' \
            'GROUP=org.example' \
            'VERSION_NAME=1.2.3' \
            'POM_NAME=Example' > expected.properties
          diff expected.properties gradle.properties
          test ! -e gradle.properties.bak

      - uses: $/.github/actions/set-release-version
        id: invalid-tag
        continue-on-error: true
        with:
          tag: v1.2.3/evil

      - name: Remove VERSION_NAME
        run: |
          grep -v '^VERSION_NAME=' gradle.properties > gradle.properties.tmp
          mv gradle.properties.tmp gradle.properties

      - uses: $/.github/actions/set-release-version
        id: missing-version
        continue-on-error: true
        with:
          tag: v1.2.3

      - name: Check the rejected cases
        env:
          INVALID_TAG: ${{ steps.invalid-tag.outcome }}
          MISSING_VERSION: ${{ steps.missing-version.outcome }}
        run: |
          test "$INVALID_TAG" = failure
          test "$MISSING_VERSION" = failure

  # Upload and apply run in two jobs, like their callers: downloading an artifact in the job that has just
  # uploaded it fails intermittently ("Artifact not found for name")
  regenerated-files-upload:
    name: regenerated-files-upload
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the regenerated files
        run: |
          mkdir -p work/dir/sub
          echo file > work/file.txt
          echo kept > work/dir/sub/kept.txt
          echo hidden > work/dir/.hidden
          echo other > work/other.txt
          mkdir -p work/dir/build
          echo output > work/dir/build/output.txt
          # ignored by git without adding a file to the regenerated paths
          mkdir -p .git/info
          echo /work/dir/build/ >> .git/info/exclude
          mkdir -p work/invalid
          echo invalid > "work/invalid/$(printf 'a\tb')"

      - uses: $/.github/actions/upload-regenerated-files
        with:
          paths: work/file.txt work/dir

      - uses: $/.github/actions/upload-regenerated-files
        with:
          name: invalid-file-name
          paths: work/invalid

  regenerated-files:
    name: regenerated-files
    needs: regenerated-files-upload
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create stale files
        run: |
          mkdir -p work/dir
          echo stale > work/dir/removed.txt
          echo untouched > work/other.txt

      - uses: $/.github/actions/apply-regenerated-files
        with:
          paths: work/file.txt work/dir

      - name: Check the applied files
        run: |
          test "$(cat work/file.txt)" = file
          test "$(cat work/dir/sub/kept.txt)" = kept
          test "$(cat work/dir/.hidden)" = hidden
          test "$(cat work/other.txt)" = untouched
          test ! -e work/dir/removed.txt
          # ignored by git: never handed over
          test ! -e work/dir/build

      - uses: $/.github/actions/apply-regenerated-files
        id: missing-path
        continue-on-error: true
        with:
          paths: work/missing.txt

      - uses: $/.github/actions/apply-regenerated-files
        id: invalid-name
        continue-on-error: true
        with:
          name: invalid-file-name
          paths: work/invalid

      - name: Check the rejected cases
        env:
          MISSING_PATH: ${{ steps.missing-path.outcome }}
          INVALID_NAME: ${{ steps.invalid-name.outcome }}
        run: |
          test "$MISSING_PATH" = failure
          # download-artifact replaces a tab in a name: either way, it must not reach the working directory
          if [[ "$INVALID_NAME" == success ]]; then
            test -z "$(LC_ALL=C find work/invalid -name '*[[:cntrl:]]*')"
          fi

  docker-publish:
    name: docker-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # a RUN in the target platforms (emulated for arm64), a named context and a build argument
      - name: Create the image files
        run: |
          mkdir -p work/app work/conf
          echo app > work/app/app.txt
          echo conf > work/conf/conf.txt
          cat > work/Dockerfile.test <<'DOCKERFILE'
          FROM busybox:1.37
          ARG GREETING
          COPY --from=conf conf.txt /conf.txt
          COPY app.txt /app.txt
          RUN test "$GREETING" = hello && uname -m > /arch
          DOCKERFILE

      - uses: $/.github/actions/docker-publish
        id: publish
        with:
          image: ghcr.io/litote/ci-test
          tags: |
            type=semver,pattern={{version}},value=1.2.3
            type=semver,pattern={{major}}.{{minor}},value=1.2.3
          context: work/app
          file: work/Dockerfile.test
          build-contexts: conf=work/conf
          build-args: GREETING=hello
          emulate: 'true'
          push: 'false'

      - name: Check the outputs
        env:
          TAGS: ${{ steps.publish.outputs.tags }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          test "$VERSION" = 1.2.3
          diff <(printf '%s\n' ghcr.io/litote/ci-test:1.2.3 ghcr.io/litote/ci-test:1.2) <(printf '%s\n' "$TAGS")

  app-token:
    name: app-token
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Dependabot pull requests have no access to the secrets
      - name: Secrets available
        id: secrets
        env:
          AVAILABLE: ${{ secrets.RELEASE_PLEASE_APP_ID != '' }}
        run: echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/app-token
        id: token
        if: steps.secrets.outputs.available == 'true'
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-pull-requests: read

      - name: Check the token
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # the current repository only
          test "$(gh api /installation/repositories --jq '[.repositories[].full_name] | join(",")')" = "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/pulls?per_page=1" > /dev/null

      # No permission, permission-contents emptied explicitly: refused before any token is created. With the real
      # secrets, so that a broken check, or an empty value replaced by the default write, would create a token (with
      # every permission of the App in the first case, revoked at the end of the job) and fail the check below
      - uses: $/.github/actions/app-token
        id: no-permission
        if: steps.secrets.outputs.available == 'true'
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: ''

      - name: Check the rejected case
        if: steps.secrets.outputs.available == 'true'
        env:
          NO_PERMISSION: ${{ steps.no-permission.outcome }}
          NO_PERMISSION_TOKEN: ${{ steps.no-permission.outputs.token }}
        run: |
          test "$NO_PERMISSION" = failure
          test -z "$NO_PERMISSION_TOKEN"

  # On a branch of its own, created from a commit without parent, so without the workflows, and deleted at the end
  commit-via-api:
    name: commit-via-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Dependabot pull requests have no access to the secrets
      - name: Secrets available
        id: secrets
        env:
          AVAILABLE: ${{ secrets.RELEASE_PLEASE_APP_ID != '' }}
        run: echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/app-token
        id: token
        if: steps.secrets.outputs.available == 'true'
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Create the branch
        id: branch
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ci-test/commit-via-api-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          TREE=$(jq -n '{tree: [
              {path: "work/kept.txt", mode: "100644", type: "blob", content: "kept\n"},
              {path: "work/removed.txt", mode: "100644", type: "blob", content: "removed\n"},
              {path: "work/script.sh", mode: "100644", type: "blob", content: "old\n"}
            ]}' | gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" \
            --raw-field message='test: base of commit-via-api' --raw-field tree="$TREE" --jq '.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field ref="refs/heads/$BRANCH" --raw-field sha="$BASE" --silent
          {
            echo "name=$BRANCH"
            echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"

      # The same files in a local repository, then changed: a removal, an addition, an executable and a symbolic link
      - name: Change the files
        if: steps.secrets.outputs.available == 'true'
        run: |
          git init --quiet
          mkdir work
          echo kept > work/kept.txt
          echo removed > work/removed.txt
          echo old > work/script.sh
          git add --all
          git -c user.name=ci -c user.email=ci@example.invalid commit --quiet --message base
          rm work/removed.txt
          echo new > work/script.sh
          chmod +x work/script.sh
          echo new > work/new.txt
          ln -s new.txt work/link

      # A message starting with @, which --field would read as a file
      - uses: $/.github/actions/commit-via-api
        if: steps.secrets.outputs.available == 'true'
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ steps.branch.outputs.name }}
          paths: work
          message: '@ci-test'
          expected-head: ${{ steps.branch.outputs.base }}

      - name: Check the commit
        id: commit
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD" \
            --jq '[.message, .parents[0].sha, .verification.verified] | @tsv' > "$RUNNER_TEMP/commit.tsv"
          diff <(printf '%s\t%s\t%s\n' '@ci-test' "$BASE" true) "$RUNNER_TEMP/commit.tsv"
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$HEAD?recursive=1" \
            --jq '.tree[] | select(.type == "blob") | "\(.mode) \(.path)"' | sort > "$RUNNER_TEMP/tree.txt"
          diff <(printf '%s\n' '100644 work/kept.txt' '100644 work/new.txt' '100755 work/script.sh' '120000 work/link' | sort) "$RUNNER_TEMP/tree.txt"
          LINK=$(gh api "repos/$GITHUB_REPOSITORY/contents/work/link?ref=$HEAD" --jq '.target')
          test "$LINK" = new.txt
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      # The branch already has this content: no empty commit
      - uses: $/.github/actions/commit-via-api
        if: steps.secrets.outputs.available == 'true'
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ steps.branch.outputs.name }}
          paths: work
          message: 'test: same content'

      - name: Change a file again
        if: steps.secrets.outputs.available == 'true'
        run: echo newer > work/new.txt

      # The branch moved since the base: the changes are stale
      - uses: $/.github/actions/commit-via-api
        if: steps.secrets.outputs.available == 'true'
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ steps.branch.outputs.name }}
          paths: work
          message: 'test: stale changes'
          expected-head: ${{ steps.branch.outputs.base }}

      - name: Check that nothing else was committed
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          HEAD: ${{ steps.commit.outputs.head }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$HEAD"

      - name: Delete the branch
        if: always() && steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" --method DELETE

  # Against a merged Dependabot pull request: one commit of Dependabot and two of the bot
  check-bot-commits:
    name: check-bot-commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: $/.github/actions/check-bot-commits
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '126'
          allowed-paths: ^(gradle/verification-metadata\.xml|e2e-split/kotlin-js-store/(wasm/)?yarn\.lock)$

      - uses: $/.github/actions/check-bot-commits
        id: unexpected-path
        continue-on-error: true
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '126'
          allowed-paths: ^gradle/verification-metadata\.xml$

      - uses: $/.github/actions/check-bot-commits
        id: unexpected-bot
        continue-on-error: true
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '126'
          allowed-paths: .*
          bot: another-bot[bot]

      # Not a Dependabot pull request: allowed whatever the paths
      - uses: $/.github/actions/check-bot-commits
        with:
          repository: Litote/openapi-ktor-client-generator
          pull-request: '125'
          allowed-paths: ^$

      - name: Check the rejected cases
        env:
          UNEXPECTED_PATH: ${{ steps.unexpected-path.outcome }}
          UNEXPECTED_BOT: ${{ steps.unexpected-bot.outcome }}
        run: |
          test "$UNEXPECTED_PATH" = failure
          test "$UNEXPECTED_BOT" = failure

  setup-terraform:
    name: setup-terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the configurations
        run: |
          mkdir -p work/no-provider work/unlocked
          echo 'terraform {}' > work/no-provider/main.tf
          printf '%s\n' \
            'terraform {' \
            '  required_providers {' \
            '    null = { source = "hashicorp/null", version = "~> 3.2" }' \
            '  }' \
            '}' > work/unlocked/main.tf

      - uses: $/.github/actions/setup-terraform
        with:
          working-directory: work/no-provider

      - name: Check the Terraform version
        working-directory: work/no-provider
        run: terraform version -json | jq -e '.terraform_version == "1.16.7"'

      # without .terraform.lock.hcl, init must not resolve the provider
      - uses: $/.github/actions/setup-terraform
        id: unlocked
        continue-on-error: true
        with:
          working-directory: work/unlocked

      - name: Check the rejected cases
        env:
          UNLOCKED: ${{ steps.unlocked.outcome }}
        run: test "$UNLOCKED" = failure

  setup-mkdocs:
    name: setup-mkdocs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mkdocs

      - name: Create the sites
        run: |
          mkdir -p work/valid/docs work/broken-link/docs
          for site in valid broken-link; do
            printf '%s\n' "site_name: ${site}" 'theme:' '  name: material' > "work/${site}/mkdocs.yml"
          done
          echo '# Home' > work/valid/docs/index.md
          echo '[missing](missing.md)' > work/broken-link/docs/index.md

      - name: Build the valid site
        working-directory: work/valid
        run: |
          mkdocs build --strict
          test -f site/index.html

      # --strict must fail on a broken link
      - name: Build the site with a broken link
        id: broken-link
        continue-on-error: true
        working-directory: work/broken-link
        run: mkdocs build --strict

      - name: Check the rejected cases
        env:
          BROKEN_LINK: ${{ steps.broken-link.outcome }}
        run: test "$BROKEN_LINK" = failure

  # arm64 runner: the native image is checked against the architecture it is compiled for
  setup-graalvm:
    name: setup-graalvm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-graalvm

      - name: Compile a native image
        run: |
          mkdir -p work
          cd work
          printf '%s\n' 'public class Hello {' \
            '  public static void main(String[] args) { System.out.println("hello"); }' \
            '}' > Hello.java
          javac Hello.java
          native-image --version
          native-image -cp . Hello hello
          test "$(./hello)" = hello

      - name: Check the JDK
        run: |
          java -version 2>&1 | tee version.txt
          grep -q 'GraalVM CE' version.txt
          grep -q 'version "25' version.txt

      - uses: $/.github/actions/check-native-arch
        with:
          working-directory: work
          binaries: hello

      - uses: $/.github/actions/check-native-arch
        id: wrong-architecture
        continue-on-error: true
        with:
          working-directory: work
          binaries: hello
          architecture: x86_64

      - uses: $/.github/actions/check-native-arch
        id: missing-binary
        continue-on-error: true
        with:
          working-directory: work
          binaries: |
            hello
            missing

      - uses: $/.github/actions/check-native-arch
        id: unknown-architecture
        continue-on-error: true
        with:
          working-directory: work
          binaries: hello
          architecture: riscv64

      - name: Check the rejected cases
        env:
          WRONG_ARCHITECTURE: ${{ steps.wrong-architecture.outcome }}
          MISSING_BINARY: ${{ steps.missing-binary.outcome }}
          UNKNOWN_ARCHITECTURE: ${{ steps.unknown-architecture.outcome }}
        run: |
          test "$WRONG_ARCHITECTURE" = failure
          test "$MISSING_BINARY" = failure
          test "$UNKNOWN_ARCHITECTURE" = failure
